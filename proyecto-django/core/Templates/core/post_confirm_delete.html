{% extends 'core/base.html' %}
{% block title %}Eliminar Post{% endblock %}
{% block content %}
<h1>¿Eliminar el post "{{ post.title }}"?</h1>
<form method="post">
    {% csrf_token %}
    <button type="submit">Sí, eliminar</button>
</form>
<br>
<a href="{% url 'core:post-list' %}">Cancelar</a>
{% endblock %}
