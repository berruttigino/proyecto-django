<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar Post</title>
</head>
<body>
    <h1>¿Eliminar el post "{{ post.title }}"?</h1>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Sí, eliminar</button>
    </form>
    <br>
    <a href="{% url 'core:post-list' %}">Cancelar</a>
</body>
</html>
